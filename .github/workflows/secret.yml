name: cho

on: 
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'log'
        required: false
        default: 'info'

jobs:
  test:
    name: PUSssy Server
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: build
        run: >
          sudo apt install stun-client
          stun stun.l.google.com:19302
